[package]
name = "clipnest"
version = "0.1.0"
edition = "2021"
description = "Lightweight, keyboard-first clipboard manager for Linux (inspired by Maccy for macOS)"
license = "MIT"
rust-version = "1.83"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gdk-wayland = { package = "gdk4-wayland", version = "0.11" }
# Same gio as gtk re-exports; enables ApplicationCommandLine::print_literal (GLib 2.80).
gio = { version = "0.22", features = ["v2_80"] }
x11rb = { version = "0.14", features = ["xfixes"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fuzzy-matcher = "0.3"
async-channel = "2"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
